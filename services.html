<!doctype html>
<html lang="fr">
<head>

  
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Services — BTP_appGRP3</title>
<style>
  /* Style simple, couleurs: bleu, bleu-ciel, blanc */
  :root{
    --blue: #1E3A8A;
    --sky:#7fc7ff;
    --bg:#f7fbff;
    --card:#ffffff;
    --muted:#6b7280;
  }
  *{box-sizing:border-box}
  body{font-family:Inter, system-ui, Arial; margin:0; background:var(--bg); color:#0b1723}
  header{background:linear-gradient(90deg,var(--blue),var(--sky)); color:white; padding:18px 20px; display:flex; align-items:center; gap:14px}
  .logo{display:flex; align-items:center; gap:10px; font-weight:700}
  .logo svg{width:48px;height:48px}
  nav{margin-left:auto}
  nav a{color:white;text-decoration:none;margin-left:14px;font-weight:600}
  main{padding:18px;max-width:1100px;margin:20px auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
  .card{background:var(--card);padding:16px;border-radius:12px;box-shadow:0 3px 8px rgba(10,25,40,0.06)}
  h1{margin:0 0 8px 0}
  .big{font-size:28px;font-weight:800}
  .muted{color:var(--muted);font-size:14px}
  .links a{display:inline-block;margin:8px 8px 0 0;padding:8px 12px;background:var(--sky);color:#072034;border-radius:8px;text-decoration:none;font-weight:600}
  footer{max-width:1100px;margin:20px auto;color:var(--muted);font-size:13px;text-align:center}
  @media (max-width:520px){header{padding:14px} .logo span{font-size:14px}}
</style>
</head>
<body>
<header>
  <div style="font-weight:700">Nos services</div>
<header style="display: flex; align-items: center; background-color: #1E3A8A; padding: 10px; font-family: 'Poppins', sans-serif;">

  
  <nav style="display: flex; gap: 20px;">
        <a href="index.html" style="color: white; text-decoration: none;">Accueil</a>
    <a href="stock_list.html" style="color: white; text-decoration: none;">Stocks</a>
    <a href="add_material.html" style="color: white; text-decoration: none;">Ajouter</a>
    <a href="services.html" style="color: white; text-decoration: none;">Services</a>
    <a href="contacts.html" style="color: white; text-decoration: none;">Contacts</a>

  </nav>
</header>
</header>

<main>
  <div class="grid" id="servicesGrid"></div>
</main>

<script src="data.js"></script>
<script>
  const data = BTP_getData();
  const g = document.getElementById('servicesGrid');
  g.innerHTML = data.services.map(s => `
    <div class="card">
      <h2>${s.title}</h2>
      <div class="muted">${s.desc}</div>
    </div>
  `).join('');
</script>
</body>
</html>
