<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Services — BTP_appGRP3</title>
<style>
  body{font-family:Inter, Arial;margin:0;background:#f7fbff;color:#042033}
  header{background:linear-gradient(90deg,#1E3A8A,#7fc7ff);color:white;padding:12px 14px;display:flex;align-items:center}
  main{max-width:1000px;margin:18px auto;padding:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  .card{background:white;padding:14px;border-radius:12px;box-shadow:0 3px 10px rgba(2,8,20,0.06)}
  h2{margin:0 0 8px 0}
  .muted{color:#6b7280}
</style>
</head>
<body>
<header>
  <div style="font-weight:700">Nos services</div>
  <a style="margin-left:auto;color:white;text-decoration:none" href="index.html">Accueil</a>
</header>

<main>
  <div class="grid" id="servicesGrid"></div>
</main>

<script src="data.js"></script>
<script>
  const data = BTP_getData();
  const g = document.getElementById('servicesGrid');
  g.innerHTML = data.services.map(s => `
    <div class="card">
      <h2>${s.title}</h2>
      <div class="muted">${s.desc}</div>
    </div>
  `).join('');
</script>
<section>
  <h3 style="color: purple; text-align: center;">De nouveaux services arrivent bientôt !</h3>
</section>

</body>
</html>
