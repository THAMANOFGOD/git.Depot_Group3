<!doctype html>
<!-- Version 1.1 - Yves ANAGUE - Améliorations globales -->
<html lang="fr">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Ajouter matériel — BTP_appGRP3</title>
<style>
  body{font-family:Inter, Arial;margin:0;background:#f7fbff;color:#042033}
  header{background:#1E3A8A;color:white;padding:12px 14px;display:flex;align-items:center}
  main{max-width:900px;margin:18px auto;padding:12px}
  .grid{display:grid;grid-template-columns:1fr 320px;gap:12px}
  .card{background:white;padding:14px;border-radius:10px;box-shadow:0 3px 10px rgba(2,8,20,0.06)}
  .contact{padding:8px 0;border-bottom:1px solid #eef7ff}
  label{display:block;margin-top:8px}
  input,textarea{width:100%;padding:8px;border-radius:8px;border:1px solid #e6f2ff}
  button{margin-top:10px;padding:10px;border-radius:8px;border:none;background:#0a66c2;color:white;font-weight:700}
</style>
</head>
<body>
<header>
  <div style="font-weight:700;font-size:18px">➕ Ajouter matériel</div>
  <a style="margin-left:auto;color:white;text-decoration:none" href="stock_list.html">Voir stocks</a>
  <header style="display: flex; align-items: center; background-color: #1E3A8A; padding: 10px; font-family: 'Poppins', sans-serif;">

  
  <nav style="display: flex; gap: 20px;">
        <a href="index.html" style="color: white; text-decoration: none;">Accueil</a>
    <a href="stock_list.html" style="color: white; text-decoration: none;">Stocks</a>
    <a href="add_material.html" style="color: white; text-decoration: none;">Ajouter</a>
    <a href="services.html" style="color: white; text-decoration: none;">Services</a>
    <a href="contacts.html" style="color: white; text-decoration: none;">Contacts</a>

  </nav>
</header>
</header>

<main>
  <form id="formAdd" onsubmit="return false" aria-label="Formulaire d'ajout">
    <label>Nom du matériel<input id="name" required /></label>
    <div class="row">
      <label>Quantité<input id="qty" type="number" min="0" value="1" required /></label>
      <label>Unité<input id="unit" value="pcs" required /></label>
    </div>
    <label>Localisation<input id="location" value="Entrepôt A" /></label>
    <div class="row">
      <label>Prix unitaire (FCFA)<input id="price" type="number" min="0" value="0" /></label>
      <label>ID souhaité (optionnel)<input id="id" placeholder="laisser vide => génération automatique" /></label>
    </div>
    <label>Description<textarea id="desc" rows="3"></textarea></label>

    <div class="actions">
      <button class="btn primary" id="saveBtn">Enregistrer</button>
      <a class="btn ghost" href="stock_list.html">Annuler</a>
    </div>
    <div id="msg" style="margin-top:10px;color:green"></div>
  </form>
</main>

<script src="data.js"></script>
<script>
  // Add logic
  const form = document.getElementById('formAdd');
  const msg = document.getElementById('msg');

  document.getElementById('saveBtn').addEventListener('click', function(){
    const name = document.getElementById('name').value.trim();
    const qty = Number(document.getElementById('qty').value);
    const unit = document.getElementById('unit').value.trim() || 'pcs';
    const location = document.getElementById('location').value.trim();
    const price = Number(document.getElementById('price').value) || 0;
    const description = document.getElementById('desc').value.trim();
    let id = document.getElementById('id').value.trim();

    if(!name){ alert('Donne un nom au matériel'); return; }

    const data = BTP_getData();

    if(!id) {
      id = BTP_newMaterialId(data);
    } else {
      if(data.materials.find(m=>m.id===id)){ alert('ID déjà existant, choisis un autre ou laisse vide'); return; }
    }

    const newMat = { id, name, qty, unit, location, price, description };
    data.materials.push(newMat);
    BTP_saveData(data);
    msg.textContent = `Matériel ${id} ajouté. Retour à la liste...`;
    setTimeout(()=> location.href = 'stock_list.html', 900);
  });
</script>
</body>
</html>
