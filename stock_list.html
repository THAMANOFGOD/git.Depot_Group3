<!doctype html>
<html lang="fr">
<head>

  
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Stocks — BTP_appGRP3</title>
<style>
  :root{--blue:#0a66c2;--sky:#7fc7ff;--bg:#f7fbff;--card:#fff}
  body{font-family:Inter, Arial; margin:0; background:var(--bg); color:#072034}
  header{background:var(--blue); color:white;padding:12px 16px;display:flex;align-items:center;gap:12px}
  header a{color:white;text-decoration:none;margin-left:auto}
  main{max-width:1100px;margin:18px auto;padding:10px}
  .table{background:var(--card);border-radius:10px;padding:12px;box-shadow:0 3px 10px rgba(4,10,20,0.05)}
  table{width:100%;border-collapse:collapse}
  th,td{padding:10px;text-align:left;border-bottom:1px solid #eef5fb}
  th{color:#0b2b4a}
  .actions a{margin-right:8px;text-decoration:none;color:var(--blue);font-weight:600}
  .topbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .btn{background:var(--sky);padding:8px 12px;border-radius:8px;text-decoration:none;color:#022; font-weight:600}
  @media (max-width:640px){
    table,thead,tbody,tr,th,td{display:block}
    th{display:none}
    td{padding:8px 6px;border-bottom:1px solid #eef5fb}
    td:before{content:attr(data-label);font-weight:700;display:block;color:#4b6b86}
  }
</style>
</head>
<body>
<header>
  <div style="font-weight:700">BTP_appGRP3 — Stocks</div>
  <a href="index.html">Dashboard </a>
</header>

<main>
  <div class="topbar" style="margin-bottom:12px">
    <a class="btn" href="add_material.html">+ Ajouter matériel</a>
    <a class="btn" href="services.html">Services</a>
  </div>

  <div class="table">
    <table id="stockTable" aria-live="polite">
      <thead>
        <tr><th>ID</th><th>Nom</th><th>Quantité</th><th>Unité</th><th>Localisation</th><th>Prix (U)</th><th>Actions</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</main>

<script src="data.js"></script>
<script>
  // Render table
  const data = BTP_getData();
  const tbody = document.querySelector('#stockTable tbody');

  function render(){
    const d = BTP_getData();
    if(!d.materials.length){
      tbody.innerHTML = '<tr><td colspan="7" class="muted">Aucun matériel</td></tr>';
      return;
    }
    tbody.innerHTML = d.materials.map(m => `
      <tr>
        <td data-label="ID">${m.id}</td>
        <td data-label="Nom">${m.name}</td>
        <td data-label="Quantité">${m.qty}</td>
        <td data-label="Unité">${m.unit}</td>
        <td data-label="Localisation">${m.location}</td>
        <td data-label="Prix">${(m.price||0).toLocaleString()}</td>
        <td class="actions" data-label="Actions">
          <a href="edit_material.html?id=${m.id}">Éditer</a>
          <a href="modify_stock.html?id=${m.id}">Modifier stock</a>
          <a href="delete_material.html?id=${m.id}">Supprimer</a>
        </td>
      </tr>
    `).join('');
  }

  render();

  // Listen to storage events to update if multiple tabs
  window.addEventListener('storage', render);
</script>
</body>
</html>
