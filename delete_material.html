<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Supprimer matériel — BTP_appGRP3</title>
<style>
  body{font-family:Inter, Arial;background:#fff9f9;color:#042033;margin:0}
  header{background:#ef4444;color:white;padding:12px 14px;display:flex;align-items:center}
  main{max-width:700px;margin:18px auto;padding:12px}
  .card{background:white;padding:14px;border-radius:10px;box-shadow:0 3px 8px rgba(0,0,0,0.04)}
  .danger{background:#fff0f0;border-left:4px solid #ef4444;padding:10px;border-radius:6px}
  .btn{padding:10px 12px;border-radius:8px;font-weight:700;border:none;cursor:pointer}
  .confirm{background:#ef4444;color:white}
  .cancel{background:#eef7ff;color:#022}
  footer{text-align:center;padding:10px;background:#f3f4f6;color:#666;font-size:0.875em;margin-top:20px}
</style>
</head>
<body>
<header>
  <div style="font-weight:700">Supprimer matériel</div>
  <a style="margin-left:auto;color:white;text-decoration:none" href="stock_list.html">Annuler</a>
</header>

<main>
  <div class="card">
    <div id="content"></div>
    <div style="margin-top:12px">
      <button class="btn confirm" id="confirm">Oui, supprimer</button>
      <a class="btn cancel" href="stock_list.html">Non, annuler</a>
    </div>
    <div id="msg" style="margin-top:10px;color:green"></div>
  </div>
</main>

<footer>
  Modified by AndrielT on October 24, 2025
</footer>

<script src="data.js"></script>
<script>
  function qp(n){return new URLSearchParams(location.search).get(n)}
  const id = qp('id'); if(!id){ alert('ID manquant'); location.href='stock_list.html'; }
  const data = BTP_getData();
  const matIndex = data.materials.findIndex(m=>m.id===id);
  if(matIndex<0){ alert('Matériel introuvable'); location.href='stock_list.html'; }
  const mat = data.materials[matIndex];
  document.getElementById('content').innerHTML = `
    <div class="danger"><strong>Suppression définitive</strong><div style="margin-top:6px">Voulez-vous vraiment supprimer <strong>${mat.name} (${mat.id})</strong> ? Cette action est irréversible.</div></div>
  `;

  document.getElementById('confirm').addEventListener('click', ()=>{
    data.materials.splice(matIndex,1);
    BTP_saveData(data);
    document.getElementById('msg').textContent = `${mat.name} supprimé. Retour à la liste...`;
    setTimeout(()=> location.href='stock_list.html',900);
  });
</script>
</body>
</html>
